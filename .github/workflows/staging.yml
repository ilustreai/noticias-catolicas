name: Staging Build & Deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node scripts/refresh-liturgical-cache.mjs
        continue-on-error: true
      - run: npm run generate
      - run: npm run validate
      - name: Generate Reels audio
        run: |
          pip install -q edge-tts
          node scripts/generate-reels-script.mjs
          mkdir -p public/audio/
          cp data/audio/reels-*.mp3 public/audio/
          cp data/reels-script-*.txt public/audio/
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: node scripts/build-html.mjs
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
      - name: Deploy to staging repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.STAGING_DEPLOY_KEY }}
          external_repository: ilustreai/noticias-catolicas-staging
          publish_branch: main
          publish_dir: ./public
          force_orphan: true
